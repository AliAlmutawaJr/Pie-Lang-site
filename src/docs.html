<!doctype html>
<html lang="en">
<head>
{{> head title="Pie documentation" description="Learn Pie: values, functions, user-defined operators, classes, types, pattern matching, packs and more."}}
<script src="assets/js/docs.js" defer></script>
</head>
<body>
{{> nav current=docs}}

<div class="docs">
    <button class="toc-toggle" id="toc-toggle" type="button" aria-expanded="false" aria-controls="toc">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
        Contents
    </button>
    <aside class="toc" id="toc" aria-label="Contents">
        <label for="toc-search" class="visually-hidden">Filter sections</label>
        <input class="toc-search" id="toc-search" type="search" placeholder="Filter sections" autocomplete="off">
        <nav>{{toc}}</nav>
    </aside>

    <main id="main" class="doc">
{{content}}
    </main>
</div>

<script type="text/plain" id="prelude">{{prelude}}</script>
{{> footer}}
</body>
</html>
