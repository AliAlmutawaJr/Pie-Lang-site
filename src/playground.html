<!doctype html>
<html lang="en">
<head>
{{> head title="Pie playground" description="Write and run Pie code in your browser."}}
<script src="assets/js/pie-highlight.js" defer></script>
<script src="assets/js/pie-editor.js" defer></script>
<script src="assets/js/examples.js" defer></script>
<script src="assets/js/pie-runner.js" defer></script>
<script src="assets/js/playground.js" defer></script>
</head>
<body class="playground-page">
{{> nav current=playground}}

<main id="main" class="pg">
    <h1 class="visually-hidden">Pie playground</h1>
    <div class="pg-toolbar">
        <button class="btn btn-primary" id="run" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
            <span>Loading Pie…</span>
        </button>
        <button class="btn" id="stop" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            Stop
        </button>
        <label for="examples">Example</label>
        <select class="pg-select" id="examples">
            <option value="">Your code</option>
        </select>
        <span class="spacer"></span>
        <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run your code</span>
        <button class="btn-small" id="share" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
            Copy link
        </button>
    </div>

    <div class="pg-main">
        <div class="pg-editor-wrap">
            <div id="editor"></div>
        </div>

        <div class="pg-side">
            <section class="pg-output-pane" aria-labelledby="out-title">
                <div class="pg-out-head">
                    <h2 id="out-title" style="font:inherit;margin:0">Output</h2>
                    <span class="spacer"></span>
                    <span class="status" id="status" aria-live="polite"></span>
                    <button type="button" id="clear">Clear</button>
                </div>
                <pre class="pg-output" id="output" tabindex="0" aria-live="polite"><span class="placeholder">Press <kbd>Run</kbd> or <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run your code. When your program asks for input, type it here.</span></pre>
            </section>

            <section class="pg-input-pane" id="input-pane" data-collapsed="true" aria-labelledby="in-title">
                <div class="pg-in-head">
                    <h2 id="in-title" style="font:inherit;margin:0">Program input</h2>
                    <!-- <span class="pg-in-hint">Used first, one line per answer</span> -->
                    <span class="spacer" style="flex:1"></span>
                    <button type="button" id="toggle-input" aria-expanded="false" aria-controls="stdin">Show</button>
                </div>
                <label for="stdin" class="visually-hidden">Answers for your program, one per line. They're used before it asks in the output panel.</label>
                <textarea id="stdin" spellcheck="false" placeholder="Each line answers one input."></textarea>
                <!-- <textarea id="stdin" spellcheck="false" placeholder="Each line answers one input. When these run out, your program asks in the output panel."></textarea> -->
            </section>
        </div>
    </div>
</main>
</body>
</html>
