    <h1 style="padding-top:42px">The Pie Programming Language Online Playground!</h1>

    <textarea id="codeInput" placeholder="Enter your code here...">print = __builtin_print;

infix + = (a, b) => __builtin_add(a, b);
infix + = (a: String, b: String) => __builtin_concat(a, b);

print("Hello" + "World" + "!");
print(1 + 2);

2 + 2 = 5;
print(2 + 2);</textarea>

    <br>
    <button id="runBtn" onclick="runInterpreter()" disabled>Loading WASM...</button>
    <div id="status" class="status">Initializing runtime environment...</div>

    <div class="output-container">
        <h3>Console Output:</h3>
        <pre id="outputTerminal">Waiting for execution...</pre>
    </div>

    <script>
        const outputTerminal = document.getElementById('outputTerminal');
        const runBtn = document.getElementById('runBtn');
        const statusDiv = document.getElementById('status');

        // 1. Configure the global Emscripten Module object BEFORE loading the script
        var Module = {
            // Prevent main() from triggering automatically on page load
            noInitialRun: true,

            // Intercept standard output (stdout)
            print: function(text) {
                if (outputTerminal.innerText === "Waiting for execution...") {
                    outputTerminal.innerText = "";
                }
                outputTerminal.innerText += text + "\n";
            },

            // Intercept standard error output (stderr)
            printErr: function(text) {
                if (outputTerminal.innerText === "Waiting for execution...") {
                    outputTerminal.innerText = "";
                }
                outputTerminal.innerText += "[ERROR] " + text + "\n";
            },

            // Fired automatically when the .wasm binary is loaded and compiled
            onRuntimeInitialized: function() {
                runBtn.disabled = false;
                runBtn.innerText = "Run Code";
                statusDiv.innerText = "Interpreter ready.";
            }
        };

        // 2. The trigger logic to pass strings to main()
        function runInterpreter() {
            const inputCode = document.getElementById('codeInput').value;
            outputTerminal.innerText = "";

            try {
                const args = ["-c", inputCode];
                Module.callMain(args);
            } catch (e) {
                outputTerminal.innerText += "\nRuntime Exception!";
                // outputTerminal.innerText += "\n[Runtime Exception] " + e.message;
            }
        }
    </script>
